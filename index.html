<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Willow Mystery · 24B0354</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  /* Playful quiz world: warm cream ground, saturated orange, amber and green, black outlines, chunky rounded type. */
  :root {
    --cream:#FBF5EA; --paper:#FFFFFF; --ink:#141414; --quiet:#5c544b; --line:#E8DFD0;
    --orange:#F2622A; --orange-d:#D44816; --orange-t:#FFE5D8; --amber:#FDB62F; --amber-t:#FFF0CC; --green:#2EE06E; --green-d:#13863F; --green-t:#DDF9E6;
    --display:"Outfit", system-ui, sans-serif; --body:"Nunito", system-ui, sans-serif;
    --lift: 0 1px 2px rgba(20,20,20,.05), 0 14px 30px -18px rgba(20,20,20,.28);
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--orange) var(--cream); }
  body { margin: 0; font: 500 17px/1.6 var(--body); color: var(--ink); background: var(--cream); caret-color: var(--orange); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--amber); color: var(--ink); }
  main { max-width: 680px; margin: 0 auto; padding: 8px 16px 150px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; text-wrap: balance; }
  h1 { font-size: clamp(2.4rem, 9vw, 3.4rem); margin: 0; }
  h2 { font-size: clamp(1.7rem, 6vw, 2.2rem); margin: 14px 0 12px; }
  h3 { font-size: 1.25rem; margin: 20px 0 8px; }
  p, li { max-width: 66ch; }
  b, strong { font-weight: 800; }
  .lead { font-size: 1.1rem; }
  mark { background: var(--amber-t); color: var(--ink); padding: 0 .3em; border-radius: 6px; box-shadow: inset 0 -3px 0 var(--amber); font-weight: 700; }
  a { color: var(--orange-d); text-underline-offset: 3px; }

  /* Hero (welcome) and page titles */
  .hero { text-align: left; margin: 6px 0 18px; }
  .hero-art { display: block; width: 100%; max-width: 380px; height: auto; margin: 0 auto 4px; }
  .arch { position: relative; padding: 26px 0 6px; margin-bottom: 8px; }
  .arch::after { content: ""; position: absolute; right: 6px; top: 14px; width: 34px; height: 34px; background: var(--orange); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }

  /* Progress: segmented pill like a carousel indicator, plus the step in words. */
  .progress { display: flex; align-items: center; gap: 12px; margin: 18px 0 2px; font: 700 .9rem/1 var(--display); color: var(--quiet); }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 10px; height: 8px; border-radius: 99px; background: #D9CFBF; transition: width .4s cubic-bezier(.16,1,.3,1); }
  .dots i.done { background: var(--ink); }
  .dots i.on { width: 34px; background: var(--orange); }

  .card { background: var(--paper); border-radius: 26px; padding: 20px; margin: 16px 0; box-shadow: var(--lift); }

  button { font: 700 1.02rem/1.2 var(--display); padding: 14px 24px; min-height: 52px; border-radius: 999px; border: 0; background: var(--orange); color: #fff; cursor: pointer; box-shadow: 0 10px 20px -10px rgba(242,98,42,.8); transition: background .15s, transform .15s; }
  button:hover { background: var(--orange-d); }
  button:active { transform: scale(.98); }
  button.ghost { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: none; }
  button.ghost:hover { background: var(--amber-t); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  /* Start: white pill with an orange knob, like a "slide to start" control. */
  .go { display: flex; align-items: center; gap: 14px; width: 100%; padding: 6px 22px 6px 6px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: var(--lift); font-size: 1.05rem; }
  .go:hover { background: var(--amber-t); }
  .go .knob { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--orange); color: #fff; flex: none; }

  /* Choices: white cards; segmented black-outlined pills for short scales. */
  .opts { display: grid; gap: 10px; margin: 10px 0 18px; }
  .opts label { display: flex; gap: 12px; align-items: center; padding: 15px 16px; border: 2px solid transparent; border-radius: 20px; background: var(--paper); box-shadow: var(--lift); cursor: pointer; font-weight: 700; transition: border-color .15s, background .15s; }
  .opts label:hover { border-color: var(--line); }
  .opts label:has(input:checked) { border-color: var(--orange); background: var(--orange-t); }
  .opts input[type=radio] { accent-color: var(--orange); width: 20px; height: 20px; margin: 0; flex: none; }
  .seg { display: flex; gap: 4px; padding: 4px; border: 2.5px solid var(--ink); border-radius: 26px; background: var(--paper); }
  .seg label { flex: 1; justify-content: center; text-align: center; padding: 11px 8px; border: 0; border-radius: 22px; box-shadow: none; font: 700 .95rem/1.25 var(--display); }
  .seg label:hover { background: var(--amber-t); }
  .seg label:has(input:checked) { background: var(--orange); color: #fff; }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--amber); }
  .seg input[type=radio] { position: absolute; opacity: 0; width: 1px; height: 1px; }

  input[type=range] { accent-color: var(--orange); width: 100%; height: 34px; }
  textarea, input[type=text], input[type=number], select { font: 600 1rem/1.4 var(--body); width: 100%; padding: 13px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--paper); color: var(--ink); }
  textarea:focus, input[type=text]:focus, input[type=number]:focus, select:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 4px var(--amber-t); }
  textarea { min-height: 110px; resize: vertical; }
  ::placeholder { color: #857b70; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font: 700 .82rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--quiet); }

  /* Agent cards: outlined avatar, name, role; review badges always in the same slot. */
  .plaque { background: var(--paper); border-radius: 24px; margin: 14px 0; box-shadow: var(--lift); overflow: hidden; }
  .plaque header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 0; flex-wrap: wrap; }
  .plaque .av { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--green); color: var(--ink); flex: none; }
  .plaque .who { display: flex; flex-direction: column; line-height: 1.2; }
  .plaque .who b { font: 800 1.08rem/1.15 var(--display); }
  .plaque .who small { font-size: .85rem; color: var(--quiet); font-weight: 700; }
  .plaque .slot { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .plaque p { margin: 12px 16px; }
  .plaque .cites { font-size: .86rem; color: var(--quiet); background: var(--cream); margin: 0; padding: 10px 16px; font-weight: 700; }
  .plaque.skep .av { background: var(--orange); color: #fff; }
  .plaque.judge .av { background: var(--amber); }
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .versus .plaque { margin: 6px 0; }
  @media (max-width: 560px) { .versus { grid-template-columns: 1fr; } }

  .fb { padding: 14px 16px; border-radius: 20px; margin: 12px 0; font-weight: 600; }
  .fb.ok { background: var(--green-t); }
  .fb.ok b:first-child { color: var(--green-d); }
  .fb.no { background: var(--amber-t); }
  .badge { display: inline-block; font: 700 .74rem/1.4 var(--display); padding: 3px 10px; border-radius: 99px; background: var(--cream); color: var(--quiet); border: 1.5px solid var(--line); }
  .badge.sample { background: var(--amber-t); color: #7a4b00; border-color: var(--amber); }
  .badge.approved { background: var(--green-t); color: var(--green-d); border-color: #9fe7b8; }
  .badge.overridden { background: var(--orange-t); color: var(--orange-d); border-color: #f9b897; }
  .badge.pending, .badge.approved, .badge.overridden { text-transform: capitalize; }
  .bar { height: 22px; border-radius: 99px; background: var(--green); border: 2px solid var(--ink); transition: width .3s cubic-bezier(.16,1,.3,1); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--quiet); font-size: .93rem; }

  /* Bottom dock: black-outlined pill bar; the current place is the orange pill. Identity token underneath. */
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 8px; background: linear-gradient(to top, var(--cream) 70%, transparent); }
  .dock { display: flex; gap: 6px; max-width: 420px; margin: 0 auto; padding: 5px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: var(--lift); }
  .dock a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; border-radius: 999px; border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font: 700 .92rem/1 var(--display); }
  .dock a:hover { background: var(--amber-t); }
  .dock a.on { background: var(--orange); color: #fff; border-color: var(--orange); }
  .id { text-align: center; margin: 6px 0 0; font: 700 .8rem/1.2 var(--display); color: var(--quiet); }
  .id b { color: var(--ink); letter-spacing: .04em; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
