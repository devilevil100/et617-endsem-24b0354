<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Willow Mystery · 24B0354</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Barlow+Condensed:wght@600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Glasshouse: bottle-green iron frame, pale glass ground, white enamel plant plaques, sunlight amber for the learner. */
  :root {
    --iron:#1d3a2b; --iron-2:#2b5a42; --glass:#e8efe6; --pane:#f3f7f1; --enamel:#fffdf7; --ink:#14221a; --quiet:#46594e; --line:#c6d4c9;
    --sun:#e9a23b; --sun-t:#fbecd0; --leaf:#2a7148; --leaf-t:#e0eee4; --skep:#9c421a; --skep-t:#f6e2d5; --judge:#31438a; --judge-t:#e2e6f4;
    --warn:#7f4f00; --warn-t:#fbeed3;
    --display:"Fraunces", Georgia, serif; --label:"Barlow Condensed", "Arial Narrow", sans-serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
    --bars: repeating-linear-gradient(90deg, transparent 0 62px, rgba(255,253,247,.07) 62px 64px);
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--iron-2) var(--glass); }
  body { margin: 0; font: 17px/1.6 var(--body); color: var(--ink); background: var(--glass); caret-color: var(--iron); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--sun-t); color: var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 650; letter-spacing: -0.015em; line-height: 1.15; text-wrap: balance; }
  h1 { font-size: clamp(2.1rem, 7vw, 3rem); margin: 0; }
  h2 { font-size: clamp(1.45rem, 4.4vw, 1.8rem); margin: 30px 0 10px; }
  h3 { font-size: 1.2rem; margin: 22px 0 8px; }
  p, li { max-width: 68ch; }
  .lead { font-size: 1.12rem; }
  mark { background: var(--sun-t); color: var(--ink); padding: 0 .25em; border-radius: 4px; box-shadow: inset 0 -2px 0 var(--sun); }
  a { color: var(--iron-2); text-underline-offset: 3px; }

  /* Signature: the glasshouse frame. Iron glazing bars; one arched pane lights per step. */
  .arch, .frame { margin: 0 -16px; background: var(--bars), var(--iron); color: var(--enamel); border-radius: 0 0 28px 28px; }
  .arch { padding: 44px 20px 32px; margin-bottom: 22px; }
  .arch h1 { color: var(--enamel); max-width: 688px; margin: 0 auto; }
  .frame { padding: 16px 16px 14px; margin-bottom: 6px; }
  .frame ol { list-style: none; margin: 0 auto; padding: 0; max-width: 688px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .frame li { max-width: none; text-align: center; padding: 12px 4px 7px; color: #b5c9bb; background: rgba(232,239,230,.09); border: 1px solid rgba(232,239,230,.18); border-radius: 40px 40px 4px 4px / 22px 22px 4px 4px; }
  .frame li span { display: block; font: 600 1.15rem/1 var(--label); }
  .frame li em { display: block; font: 600 .74rem/1.2 var(--label); letter-spacing: .06em; text-transform: uppercase; font-style: normal; margin-top: 4px; }
  .frame li.lit { color: #f6e4c3; background: rgba(233,162,59,.24); border-color: rgba(233,162,59,.5); }
  .frame li.on { color: var(--iron); background: var(--sun); border-color: var(--sun); animation: light .8s cubic-bezier(.16,1,.3,1); }
  @keyframes light { from { background: rgba(232,239,230,.09); color: #b5c9bb; } }
  @media (max-width: 560px) { .frame li em { display: none; } }

  .card { background: var(--enamel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 16px 0; box-shadow: 0 1px 2px rgba(20,34,26,.06), 0 8px 20px -14px rgba(20,34,26,.28); }
  button { font: 700 1rem/1.2 var(--body); padding: 13px 20px; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--iron); background: var(--iron); color: var(--enamel); cursor: pointer; transition: background .15s, transform .15s; }
  button:hover { background: var(--iron-2); }
  button:active { transform: translateY(1px); }
  button.ghost { background: transparent; color: var(--iron); }
  button.ghost:hover { background: var(--pane); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  .opts { display: grid; gap: 8px; margin: 10px 0 18px; }
  .opts label { display: flex; gap: 12px; align-items: center; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--enamel); cursor: pointer; transition: border-color .15s, background .15s; }
  .opts label:hover { border-color: var(--iron-2); }
  .opts label:has(input:checked) { border-color: var(--iron); background: var(--sun-t); box-shadow: inset 0 0 0 1px var(--iron); }
  input[type=radio] { accent-color: var(--iron); width: 18px; height: 18px; margin: 0; flex: none; }
  input[type=range] { accent-color: var(--sun); width: 100%; height: 32px; }
  textarea, input[type=text], input[type=number], select { font: inherit; width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--enamel); color: var(--ink); }
  textarea:focus, input[type=text]:focus, input[type=number]:focus, select:focus { border-color: var(--iron); outline: none; box-shadow: 0 0 0 3px var(--sun-t); }
  textarea { min-height: 100px; resize: vertical; }
  ::placeholder { color: #66786d; }
  label > b, p > b { font-weight: 700; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font: 600 .82rem/1.2 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); }

  /* Enamel plant plaques for the agents; review badges always sit in the same slot. */
  .plaque { background: var(--enamel); border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; overflow: hidden; box-shadow: 0 1px 2px rgba(20,34,26,.06), 0 8px 20px -14px rgba(20,34,26,.3); }
  .plaque header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 9px 14px; background: var(--leaf-t); border-bottom: 1px solid var(--line); }
  .plaque header b { font: 600 1.06rem/1.2 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--leaf); }
  .plaque header small { font-size: .84rem; color: var(--quiet); }
  .plaque .slot { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .plaque p { margin: 12px 14px; }
  .plaque .cites { font-size: .85rem; color: var(--quiet); border-top: 1px dashed var(--line); padding-top: 9px; margin-top: 0; }
  .plaque.skep header { background: var(--skep-t); } .plaque.skep header b { color: var(--skep); }
  .plaque.judge header { background: var(--judge-t); } .plaque.judge header b { color: var(--judge); }
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .versus .plaque { margin: 6px 0; }
  @media (max-width: 560px) { .versus { grid-template-columns: 1fr; } }

  .fb { padding: 13px 15px; border-radius: 12px; margin: 12px 0; border: 1px solid transparent; }
  .fb.ok { background: var(--leaf-t); border-color: #b5d3bf; }
  .fb.no { background: var(--warn-t); border-color: #e8cc93; }
  .badge { display: inline-block; font: 600 .76rem/1.4 var(--label); letter-spacing: .05em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; background: var(--pane); color: var(--quiet); border: 1px solid var(--line); }
  .badge.sample { background: var(--warn-t); color: var(--warn); border-color: #e8cc93; }
  .badge.approved { background: var(--leaf-t); color: var(--leaf); border-color: #b5d3bf; }
  .badge.overridden { background: var(--judge-t); color: var(--judge); border-color: #c3cbe8; }
  .bar { height: 22px; border-radius: 6px; background: var(--iron-2); transition: width .3s cubic-bezier(.16,1,.3,1); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--quiet); font-size: .93rem; }

  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--iron); color: #cddfd2; padding: 10px 16px; font-size: .88rem; display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; }
  footer b { color: var(--enamel); letter-spacing: .04em; }
  footer a { color: var(--enamel); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<main id="app"></main>
<footer><span>ET 617 End-Sem · <b>24B0354</b></span><span><a href="#">Learner</a> · <a href="#teacher">Teacher view</a> · <a href="#about">About</a></span></footer>

</body>
</html>
